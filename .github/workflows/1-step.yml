name: Step 1

on:
  push:
    branches: [main]
    paths: [specs/report-workflow.md]
  workflow_dispatch:

permissions: {}
concurrency:
  group: lesson-1
  cancel-in-progress: false
env:
  STEP_2_FILE: .github/steps/2-step.md

jobs:
  find_exercise:
    if: >-
      !github.event.repository.is_template && github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || github.event.created == false)
    permissions:
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercise: Specify an Agentic Data Workflow"
  check_step_work:
    needs: [find_exercise]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: baseline
          persist-credentials: false
      - uses: ./baseline/.github/actions/grade
        with:
          stage: "1"
          issue-number: ${{ needs.find_exercise.outputs.issue-number }}
          submission-ref: ${{ github.sha }}
  post_next_step_content:
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/advance
        with:
          issue-number: ${{ needs.find_exercise.outputs.issue-number }}
          next-step: "2"
          content-file: ${{ env.STEP_2_FILE }}
